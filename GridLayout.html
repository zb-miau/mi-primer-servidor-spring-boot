<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .contenedor{
            display: grid;
            grid-template-columns: 100px 100px 100px;
            gap: 10px;
            border: 2px solid deeppink;
            padding: 10px;
        }

        .caja{
            height:100px;
            background-color: pink;
            border: 2px solid hotpink;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .parent{
            display:grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 100px);
            gap: 10px;
            width: 500px;
        }

        .parent div{
            border: 1px solid black;
            background-color: palegoldenrod;
        }

        .div1{
            grid-area: 1/1/3/2;
            /*Empieza en la fila y columna
            1 y termina antes de llegar a la
             fila 3 y la columna 2*/
        }

        .div2{
            grid-area: 1/2/3/4;
            /*Empieza en la fila 1 y columna
            2 y termina antes de llegar a la
             fila 3 y la columna 4*/
        }

        .div3{
            grid-area: 1/4/2/5;
            /*Empieza en la fila 1 y columna
            4 y termina antes de llegar a la
             fila 2 y la columna 5*/
        }

        .div4{
            grid-area: 2/4/3/5;
            /*Empieza en la fila 2 y columna
            4 y termina antes de llegar a la
             fila 3 y la columna 5*/
        }

        .div5{
            grid-area: 3/1/5/3;
            /*Empieza en la fila 3 y columna
            1 y termina antes de llegar a la
             fila 5 y la columna 3*/
        }

        .div6{
            grid-area: 4/3/5/5;
            /*Empieza en la fila 4 y columna
            3 y termina antes de llegar a la
             fila 5 y la columna 5*/
        }

        .div7{
            grid-area: 3/3/4/5;
            /*Empieza en la fila 3 y columna
            3 y termina antes de llegar a la
             fila 4 y la columna 5*/
        }

    </style>
</head>
<body>
    <div class="contenedor">
        <div class="caja"></div>
        <div class="caja"></div>
        <div class="caja"></div>
        <div class="caja"></div>
        <div class="caja"></div>
        <div class="caja"></div>
    </div>

    <div class="parent">
        <div class="div1"></div>
        <div class="div2"></div>
        <div class="div3"></div>
        <div class="div4"></div>
        <div class="div5"></div>
        <div class="div6"></div>
        <div class="div7"></div>
    </div>
</body>
</html>
